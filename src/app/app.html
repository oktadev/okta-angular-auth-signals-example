<header class="flex h-16 items-center justify-between border-b border-gray-200 bg-white px-4 shadow-sm">
  <a
    routerLink="/"
    class="rounded text-xl font-bold text-gray-900 focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:ring-offset-2"
  >
    User Portal
  </a>

  @if (isAuthenticated$ | async) {
    <div class="flex items-center gap-3">
      @if (userName$ | async; as name) {
        <span class="text-sm text-gray-600">{{ name }}</span>
      }

      <button
        type="button"
        class="rounded border border-gray-200 px-3 py-1 text-sm font-medium text-gray-600 hover:shadow focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:ring-offset-2"
        (click)="signOut()"
      >
        Sign out
      </button>
    </div>
  } @else {
    <button
      type="button"
      class="rounded border border-gray-200 px-3 py-1 text-sm font-medium text-gray-600 hover:shadow focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:ring-offset-2"
      (click)="signIn()"
    >
      Sign in
    </button>
  }
</header>

<main class="mx-auto max-w-5xl px-4 py-8">
  <router-outlet />
</main>
